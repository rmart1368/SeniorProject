name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/web/app.js
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo +stable test --locked 2>&1 | tee rust-test-output.log
      - name: Report Rust test failure details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          log = Path("rust-test-output.log")
          if log.exists():
              output = log.read_text(errors="replace")
              start = output.rfind("\nfailures:")
              detail = output[start:] if start >= 0 else output[-12000:]
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Rust test failure details::" + detail)
      - name: Test unified Linux installation and service units
        if: runner.os == 'Linux'
        run: python3 scripts/test-install-linux.py target/debug/chompedr
      - name: Test response queue, approvals and isolated actions
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s response/tests -p 'test_*.py'
      - name: Test real SSH authentication logs on Linux
        if: runner.os == 'Linux'
        run: sudo python3 scripts/live-ssh-test.py target/debug/chompedr
      - name: Test real Linux process observations
        if: runner.os == 'Linux'
        run: python3 scripts/live-process-test.py target/debug/chompedr
      - name: Test selected-file metadata monitoring
        if: runner.os == 'Linux'
        run: python3 scripts/live-file-test.py target/debug/chompedr
      - name: Test dashboard API, adapters and staged installation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s dashboard/tests -p 'test_*.py'
      - name: Test background collectors, dashboard and automatic restart
        if: runner.os == 'Linux'
        run: sudo python3 scripts/live-system-service-test.py target/debug/chompedr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native release executable
        run: cargo +stable build --release --locked
      - name: Package and smoke-test extracted build
        run: python scripts/package.py
      - name: Upload tested snapshot package
        uses: actions/upload-artifact@v4
        with:
          name: chomp-edr-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
